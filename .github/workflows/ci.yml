name: UDB CI & Production Deployment

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  release:
    name: Resolve UnrealIRCd Stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      url: ${{ steps.resolve.outputs.url }}
      sha256: ${{ steps.resolve.outputs.sha256 }}

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" .
          git fetch origin "$GITHUB_REF" --depth 1
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Resolve and download supported Stable
        id: resolve
        run: python3 scripts/resolve_unrealircd_release.py --archive "$RUNNER_TEMP/unrealircd.tar.gz" --github-output "$GITHUB_OUTPUT"

  agentic:
    name: Agent Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" .
          git fetch origin "$GITHUB_REF" --depth 1
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install agentic verification dependencies
        run: python3 -m pip install --disable-pip-version-check --user -r .agentic/requirements.txt -r tests/requirements.txt

      - name: Verify agent configuration
        run: ./.agentic/ci-check.sh

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [agentic, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: normal
            name: Build & Test Suite
            sanitizer: ''
          - profile: asan
            name: ASan & UBSan Sanitizers
            sanitizer: asan
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:detect_odr_violation=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      UNREALIRCD_SOURCE_URL: ${{ needs.release.outputs.url }}
      UNREALIRCD_SOURCE_SHA256: ${{ needs.release.outputs.sha256 }}

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" .
          git fetch origin "$GITHUB_REF" --depth 1
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install dependencies & configure bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libssl-dev libargon2-dev libsodium-dev libpcre2-dev libc-ares-dev libjansson-dev clang-format cmake python3-venv
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo chmod u+s $(which bwrap) || true

      - name: Define portable runtime paths
        run: |
          echo "UNREALIRCD_SOURCE=$RUNNER_TEMP/unrealircd-src" >> "$GITHUB_ENV"
          echo "UDB_TEST_IRCD_ROOT=$RUNNER_TEMP/unrealircd" >> "$GITHUB_ENV"

      - name: Bootstrap replacement suite dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/udb-test-venv"
          "$RUNNER_TEMP/udb-test-venv/bin/python3" -m pip install --disable-pip-version-check -r tests/requirements.txt
          "$RUNNER_TEMP/udb-test-venv/bin/python3" tests/support/bootstrap_cmocka.py
          echo "$RUNNER_TEMP/udb-test-venv/bin" >> "$GITHUB_PATH"

      - name: Configure and build UnrealIRCd
        run: |
          mkdir -p "$UNREALIRCD_SOURCE"
          curl --fail --location --silent --show-error --retry 3 "$UNREALIRCD_SOURCE_URL" -o "$RUNNER_TEMP/unrealircd.tar.gz"
          printf '%s  %s\n' "$UNREALIRCD_SOURCE_SHA256" "$RUNNER_TEMP/unrealircd.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/unrealircd.tar.gz" --strip-components=1 -C "$UNREALIRCD_SOURCE"
          cat > "$UNREALIRCD_SOURCE/config.settings" <<EOF
          BASEPATH="$UDB_TEST_IRCD_ROOT"
          BINDIR="$UDB_TEST_IRCD_ROOT/bin"
          DATADIR="$UDB_TEST_IRCD_ROOT/data"
          CONFDIR="$UDB_TEST_IRCD_ROOT/conf"
          MODULESDIR="$UDB_TEST_IRCD_ROOT/modules"
          LOGDIR="$UDB_TEST_IRCD_ROOT/logs"
          CACHEDIR="$UDB_TEST_IRCD_ROOT/cache"
          DOCDIR="$UDB_TEST_IRCD_ROOT/doc"
          TMPDIR="$UDB_TEST_IRCD_ROOT/tmp"
          PRIVATELIBDIR="$UDB_TEST_IRCD_ROOT/lib"
          MAXCONNECTIONS_REQUEST="auto"
          NICKNAMEHISTORYLENGTH="2000"
          GEOIP="mmdb"
          DEFPERM="0600"
          SSLDIR=""
          REMOTEINC=""
          CURLDIR=""
          NOOPEROVERRIDE=""
          OPEROVERRIDEVERIFY=""
          GENCERTIFICATE="0"
          SANITIZER="${{ matrix.sanitizer }}"
          EXTRAPARA="--with-show-opermot=no"
          ADVANCED="0"
          EOF
          cd "$UNREALIRCD_SOURCE"
          ./Config -quick
          make -j$(nproc)
          make install
          test -x "$UDB_TEST_IRCD_ROOT/bin/unrealircd"
          if [ "${{ matrix.profile }}" = "asan" ]; then
            grep -q -- '-fsanitize=address,undefined' Makefile
            ldd "$UDB_TEST_IRCD_ROOT/bin/unrealircd" > "$RUNNER_TEMP/unrealircd-ldd.txt"
            grep -q 'libasan' "$RUNNER_TEMP/unrealircd-ldd.txt"
          fi
          mkdir -p "$UDB_TEST_IRCD_ROOT/conf/tls"
          openssl req -x509 -nodes -newkey rsa:2048 -keyout "$UDB_TEST_IRCD_ROOT/conf/tls/server.key.pem" -out "$UDB_TEST_IRCD_ROOT/conf/tls/server.cert.pem" -days 365 -subj "/CN=udb-ci.test"

      - name: Build UDB and test modules
        run: |
          mkdir -p "$UNREALIRCD_SOURCE/src/modules/third"
          ln -s "$GITHUB_WORKSPACE" "$UNREALIRCD_SOURCE/src/modules/third/udb"
          cd "$UNREALIRCD_SOURCE"
          make custommodule MODULEFILE=udb/src/udb
          UDB_MODULE_PATH="$UNREALIRCD_SOURCE/src/modules/third/udb/src/udb.so"
          test -f "$UDB_MODULE_PATH"
          echo "UDB_MODULE_PATH=$UDB_MODULE_PATH" >> "$GITHUB_ENV"
          mkdir -p "$UDB_TEST_IRCD_ROOT/modules/third"
          cp src/modules/third/udb/src/udb.so "$UDB_TEST_IRCD_ROOT/modules/third/"
          make custommodule MODULEFILE=udb/tests/udb_test_state
          cp src/modules/third/udb/tests/udb_test_state.so "$UDB_TEST_IRCD_ROOT/modules/third/"
          if [ "${{ matrix.profile }}" = "asan" ]; then
            nm -D "$GITHUB_WORKSPACE/src/udb.so" > "$RUNNER_TEMP/udb-symbols.txt"
            grep -q '__asan_' "$RUNNER_TEMP/udb-symbols.txt"
          fi

      - name: Run current C unit and tooling suite
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:detect_odr_violation=2
        run: |
          python3 -m pytest -q -m 'unit or tooling' --c-profile "${{ matrix.profile }}" --junitxml "$RUNNER_TEMP/udb-unit-${{ matrix.profile }}.xml"

      - name: Run current runtime and protocol suite
        run: |
          python3 -m pytest -q -m 'integration or protocol or recovery or model' --junitxml "$RUNNER_TEMP/udb-runtime-${{ matrix.profile }}.xml"

      - name: Verify Bundle Integrity
        if: matrix.profile == 'normal'
        run: |
          python3 scripts/bundle.py --check
          git diff --exit-code

  deploy:
    name: Deploy UnrealIRCd and UDB
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [agentic, release, test]
    runs-on: [self-hosted, linux, x64, udb-deploy]
    timeout-minutes: 40
    environment: production
    concurrency:
      group: production-unrealircd
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      RELEASE_URL: ${{ needs.release.outputs.url }}
      RELEASE_SHA256: ${{ needs.release.outputs.sha256 }}

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Package verified sources
        id: bundle
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "$RELEASE_URL" -o "$RUNNER_TEMP/unrealircd.tar.gz"
          printf '%s  %s\n' "$RELEASE_SHA256" "$RUNNER_TEMP/unrealircd.tar.gz" | sha256sum --check -
          git archive --format=tar --prefix=udb/ HEAD | gzip -9 > "$RUNNER_TEMP/udb.tar.gz"
          echo "udb_sha256=$(sha256sum "$RUNNER_TEMP/udb.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deploy with protected host-local command
        env:
          DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND }}
          UDB_SHA256: ${{ steps.bundle.outputs.udb_sha256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^6\.2\.[0-9]+$ && "$RELEASE_SHA256" =~ ^[0-9a-f]{64}$ && "$UDB_SHA256" =~ ^[0-9a-f]{64}$ ]]
          deploy_uid=$(id -u)
          [[ "$deploy_uid" -ne 0 ]]
          [[ -n "$DEPLOY_COMMAND" && "$DEPLOY_COMMAND" == /* && -f "$DEPLOY_COMMAND" && -x "$DEPLOY_COMMAND" && ! -L "$DEPLOY_COMMAND" ]]
          command_path=$(realpath -e -- "$DEPLOY_COMMAND")
          workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
          [[ "$command_path" == "$DEPLOY_COMMAND" && "$command_path" != "$workspace" && "$command_path" != "$workspace/"* ]]
          [[ "$(stat -c %u -- "$command_path")" == "$deploy_uid" ]]
          probe=$command_path
          while :; do
            owner=$(stat -c %u -- "$probe")
            [[ "$owner" == "$deploy_uid" || "$owner" == 0 ]]
            mode=$(stat -c %a -- "$probe")
            (( (8#$mode & 022) == 0 ))
            [[ "$probe" == / ]] && break
            probe=${probe%/*}
            [[ -n "$probe" ]] || probe=/
          done
          "$DEPLOY_COMMAND" "$RELEASE_VERSION" "$RUNNER_TEMP/unrealircd.tar.gz" "$RELEASE_SHA256" "$RUNNER_TEMP/udb.tar.gz" "$UDB_SHA256" "$GITHUB_SHA"
