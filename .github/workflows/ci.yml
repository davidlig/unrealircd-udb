name: UDB CI & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  UDB_MODULE_PATH: ${{ github.workspace }}/src/udb.so
  UDB_TEST_IRCD_ROOT: ${{ github.workspace }}/../unrealircd

jobs:
  agentic:
    name: Agent Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 "https://github.com/${{ github.repository }}.git" .
          git fetch origin "${{ github.sha }}" --depth 1 || true
          git checkout "${{ github.sha }}" || true

      - name: Install generator dependencies
        run: python3 -m pip install --disable-pip-version-check --user -r .agentic/requirements.txt

      - name: Verify agent configuration
        run: ./.agentic/ci-check.sh

  test:
    name: Build & Test Suite
    runs-on: ubuntu-latest
    needs: agentic

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 "https://github.com/${{ github.repository }}.git" .
          git fetch origin "${{ github.sha }}" --depth 1 || true
          git checkout "${{ github.sha }}" || true

      - name: Install dependencies & configure bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libssl-dev libargon2-dev libsodium-dev libpcre2-dev libc-ares-dev libjansson-dev clang-format python3-pytest
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo chmod u+s $(which bwrap) || true

      - name: Set up UnrealIRCd development environment
        run: |
          mkdir -p ~/unrealircd-src
          wget -q https://www.unrealircd.org/downloads/unrealircd-6.2.6.tar.gz -O /tmp/unrealircd.tar.gz
          tar -xzf /tmp/unrealircd.tar.gz --strip-components=1 -C ~/unrealircd-src
          cd ~/unrealircd-src
          ./Config --with-show-opermot=no --with-bindir="$UDB_TEST_IRCD_ROOT/bin" --with-datadir="$UDB_TEST_IRCD_ROOT/data" --with-confdir="$UDB_TEST_IRCD_ROOT/conf" --with-modulesdir="$UDB_TEST_IRCD_ROOT/modules" --with-logdir="$UDB_TEST_IRCD_ROOT/logs" --with-cachedir="$UDB_TEST_IRCD_ROOT/cache" --with-docdir="$UDB_TEST_IRCD_ROOT/doc" --with-tmpdir="$UDB_TEST_IRCD_ROOT/tmp" --with-privatelibdir="$UDB_TEST_IRCD_ROOT/lib" --with-includedir="$UDB_TEST_IRCD_ROOT/include"
          make -j$(nproc)
          make install
          mkdir -p "$UDB_TEST_IRCD_ROOT/conf/tls"
          openssl req -x509 -nodes -newkey rsa:2048 -keyout "$UDB_TEST_IRCD_ROOT/conf/tls/server.key.pem" -out "$UDB_TEST_IRCD_ROOT/conf/tls/server.cert.pem" -days 365 -subj "/CN=udb-ci.test"

      - name: Build UDB and Test Modules
        run: |
          mkdir -p ~/unrealircd-src/src/modules/third
          ln -s "$GITHUB_WORKSPACE" ~/unrealircd-src/src/modules/third/udb
          cd ~/unrealircd-src
          make custommodule MODULEFILE=udb/src/udb
          mkdir -p "$UDB_TEST_IRCD_ROOT/modules/third"
          cp src/modules/third/udb/src/udb.so "$UDB_TEST_IRCD_ROOT/modules/third/"
          make custommodule MODULEFILE=udb/tests/udb_test_mutator
          cp src/modules/third/udb/tests/udb_test_mutator.so "$UDB_TEST_IRCD_ROOT/modules/third/"

      - name: Verify Bundle Integrity
        run: |
          python3 scripts/bundle.py
          git diff --exit-code -- dist/udb.c modules.list

      - name: Run Core Test Suites
        run: |
          python3 tests/test_loader_fail_safe.py
          python3 tests/test_numeric_strict.py
          python3 tests/test_ipv6_and_paths.py
          python3 tests/test_staged_sync_caps.py
          python3 tests/test_staged_sync_ownership.py
          python3 tests/test_size_invariants.py
          python3 tests/test_spamfilter_limits.py
          python3 tests/test_propagator_validation.py
          python3 tests/test_convergence_degraded_stale.py
          python3 tests/test_bootstrap_readiness_and_convergence.py
          python3 tests/test_hub_multihop_and_persistence.py

      - name: Run Integration & Multi-Hop Test Suites
        run: |
          python3 tests/test_multihop_mutations.py
          python3 tests/test_biglines_multihop.py
          python3 tests/test_propagator_failover.py
          python3 tests/test_propagator_non_adjacent.py
          python3 tests/test_propagator_runtime_failover.py
          python3 tests/runtime_clone_limit.py
          python3 tests/runtime_channel_modes_ins.py
          python3 tests/runtime_channel_nick.py
          python3 tests/runtime_debug_notices.py
          python3 tests/runtime_lock_modes.py
          python3 tests/runtime_schema_validation.py
          python3 tests/staged_runtime_effects.py
          python3 tests/three_node_udb.py
          python3 tests/two_node_udb.py

  sanitizers:
    name: ASan & UBSan Sanitizers
    runs-on: ubuntu-latest
    needs: agentic
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:detect_odr_violation=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 "https://github.com/${{ github.repository }}.git" .
          git fetch origin "${{ github.sha }}" --depth 1 || true
          git checkout "${{ github.sha }}" || true

      - name: Install dependencies & configure bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libssl-dev libargon2-dev libsodium-dev libpcre2-dev libc-ares-dev libjansson-dev clang-format python3-pytest
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo chmod u+s $(which bwrap) || true

      - name: Set up UnrealIRCd with ASan and UBSan
        run: |
          mkdir -p ~/unrealircd-src
          wget -q https://www.unrealircd.org/downloads/unrealircd-6.2.6.tar.gz -O /tmp/unrealircd.tar.gz
          tar -xzf /tmp/unrealircd.tar.gz --strip-components=1 -C ~/unrealircd-src
          cd ~/unrealircd-src
          ./Config --enable-asan --with-show-opermot=no --with-bindir="$UDB_TEST_IRCD_ROOT/bin" --with-datadir="$UDB_TEST_IRCD_ROOT/data" --with-confdir="$UDB_TEST_IRCD_ROOT/conf" --with-modulesdir="$UDB_TEST_IRCD_ROOT/modules" --with-logdir="$UDB_TEST_IRCD_ROOT/logs" --with-cachedir="$UDB_TEST_IRCD_ROOT/cache" --with-docdir="$UDB_TEST_IRCD_ROOT/doc" --with-tmpdir="$UDB_TEST_IRCD_ROOT/tmp" --with-privatelibdir="$UDB_TEST_IRCD_ROOT/lib" --with-includedir="$UDB_TEST_IRCD_ROOT/include"
          make -j$(nproc)
          make install
          mkdir -p "$UDB_TEST_IRCD_ROOT/conf/tls"
          openssl req -x509 -nodes -newkey rsa:2048 -keyout "$UDB_TEST_IRCD_ROOT/conf/tls/server.key.pem" -out "$UDB_TEST_IRCD_ROOT/conf/tls/server.cert.pem" -days 365 -subj "/CN=udb-ci.test"

      - name: Build UDB with Sanitizers
        run: |
          mkdir -p ~/unrealircd-src/src/modules/third
          ln -s "$GITHUB_WORKSPACE" ~/unrealircd-src/src/modules/third/udb
          cd ~/unrealircd-src
          make custommodule MODULEFILE=udb/src/udb
          mkdir -p "$UDB_TEST_IRCD_ROOT/modules/third"
          cp src/modules/third/udb/src/udb.so "$UDB_TEST_IRCD_ROOT/modules/third/"
          make custommodule MODULEFILE=udb/tests/udb_test_mutator
          cp src/modules/third/udb/tests/udb_test_mutator.so "$UDB_TEST_IRCD_ROOT/modules/third/"

      - name: Run Sanitized Test Suites
        run: |
          python3 tests/test_loader_fail_safe.py
          python3 tests/test_numeric_strict.py
          python3 tests/test_ipv6_and_paths.py
          python3 tests/test_staged_sync_caps.py
          python3 tests/test_staged_sync_ownership.py
          python3 tests/test_size_invariants.py
          python3 tests/test_spamfilter_limits.py
          python3 tests/test_propagator_validation.py
          python3 tests/test_convergence_degraded_stale.py
          python3 tests/test_bootstrap_readiness_and_convergence.py
          python3 tests/test_hub_multihop_and_persistence.py
          python3 tests/test_multihop_mutations.py
          python3 tests/test_propagator_failover.py
          python3 tests/test_propagator_non_adjacent.py
          python3 tests/test_propagator_runtime_failover.py
          python3 tests/runtime_clone_limit.py
          python3 tests/runtime_channel_modes_ins.py
          python3 tests/runtime_channel_nick.py
          python3 tests/runtime_debug_notices.py
          python3 tests/runtime_lock_modes.py
          python3 tests/runtime_schema_validation.py
          python3 tests/staged_runtime_effects.py
          python3 tests/three_node_udb.py
          python3 tests/two_node_udb.py
