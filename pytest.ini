[pytest]
# The pytest suite is the authoritative test discovery and CI entrypoint.
testpaths = tests/unit tests/tooling tests/integration tests/protocol tests/recovery tests/model tests/perf
pythonpath = tests/support
addopts = --strict-markers --strict-config
markers =
    unit: canonical C cases, no running daemon required
    tooling: build, generator, collection and workflow contracts
    integration: isolated real UnrealIRCd runtime
    protocol: DB/OCL wire-level scenarios
    recovery: persistence, restart and injected fault scenarios
    model: independent reference-model comparisons
    perf: opt-in deterministic benchmarks
