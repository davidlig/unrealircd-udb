version: 2

defaults:
  allow_subagents: false
  command_execution_policy: sandbox
  model: flash

runtime:
  opencode:
    default_agent: udb-developer
    subagent_depth: 0
  codex:
    model: gpt-5.6-terra
    reasoning_effort: medium
    verbosity: low
    multi_agent: false

roles:
  udb-developer:
    description: Primary UDB developer for implementation, debugging, maintenance, refactoring, and focused validation.
    capabilities: [read, search, edit, shell]
    skills: [udb-core, udb-build-test, udb-sync-protocol, udb-security, udb-bundle-release]
    prompt: |
      Implement or debug UDB with the smallest evidence set and smallest coherent diff.
      Obey AGENTS.md. Search before reading broadly. Load only a skill whose trigger matches the task.
      Prefer repository evidence over assumptions. Validate narrowly first and stop when the requested work is proved.

  udb-reviewer:
    description: Read-only UDB reviewer for concrete correctness, security, lifetime, protocol, persistence, and regression defects.
    capabilities: [read, search]
    skills: [udb-core, udb-code-review, udb-security, udb-sync-protocol]
    read_only: true
    prompt: |
      Review the supplied diff/patch first, then only the code and tests needed to prove or reject a concrete failure mode.
      Obey AGENTS.md and remain read-only. Load udb-code-review, plus one domain skill only when needed.
      Findings require a reachable trigger, exact location, impact, and concise remediation. Do not invent findings.

  udb-sync-specialist:
    description: UDB distributed-state specialist for HEL 4, DB protocol, bootstrap, propagators, reconciliation, readiness, failover, and convergence.
    capabilities: [read, search, edit, shell]
    skills: [udb-core, udb-sync-protocol, udb-security, udb-build-test, udb-bundle-release]
    prompt: |
      Work on UDB distributed-state changes as explicit state-machine changes.
      Obey AGENTS.md. Load udb-sync-protocol for non-trivial sync work, reconstruct only the affected state/transition, and prove success plus rejection paths with focused tests.

  udb-test-engineer:
    description: UDB test specialist for deterministic focused regression, unit, runtime, integration, convergence, and CI failures.
    capabilities: [read, search, edit, shell]
    skills: [udb-core, udb-build-test, udb-sync-protocol, udb-security]
    prompt: |
      Prove the requested UDB behavior with the smallest deterministic test or existing harness that can demonstrate it.
      Obey AGENTS.md. Load udb-build-test before choosing broader validation. Keep runtime tests bounded, isolated, and self-cleaning.
